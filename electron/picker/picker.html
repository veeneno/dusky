<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Compartilhar tela</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --card: #313338; --line: #3f4147;
    --text: #f2f3f5; --muted: #b5bac1; --accent: #5865f2; --accent-hover: #4752c4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  .tabs { display: flex; gap: 6px; padding: 12px 20px 0; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 0; color: var(--muted); padding: 8px 14px; cursor: pointer;
    border-bottom: 2px solid transparent; font: inherit;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card {
    background: var(--card); border: 2px solid transparent; border-radius: 8px; padding: 8px;
    cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .card:hover { background: var(--panel); }
  .card.selected { border-color: var(--accent); background: var(--panel); }
  .thumb {
    width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #111214; border-radius: 4px; display: block;
  }
  .label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .label img { width: 16px; height: 16px; flex: none; }
  .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  footer {
    display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  button.btn {
    border: 0; border-radius: 4px; padding: 9px 18px; font: inherit; cursor: pointer; color: var(--text);
    background: transparent;
  }
  button.btn:hover { text-decoration: underline; }
  button.primary { background: var(--accent); }
  button.primary:hover { background: var(--accent-hover); text-decoration: none; }
  button.primary:disabled { opacity: .45; cursor: default; background: var(--accent); text-decoration: none; }
  .refresh { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .refresh:hover { color: var(--text); }

  /* modo Wayland: só a escolha do som */
  body.audio-mode .tabs, body.audio-mode #refresh { display: none; }
  .audio-pane { display: none; flex-direction: column; gap: 10px; }
  body.audio-mode .audio-pane { display: flex; }
  body.audio-mode .grid { display: none; }
  .note {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; color: var(--muted); line-height: 1.5;
  }
  .note strong { color: var(--text); }
  .option {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 8px;
    background: var(--card); border: 2px solid transparent; cursor: pointer;
  }
  .option:hover { background: var(--panel); }
  .option.selected { border-color: var(--accent); background: var(--panel); }
  .option input { margin-top: 3px; accent-color: var(--accent); }
  .option .txt { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .option .txt small { color: var(--muted); }
  .apps { display: flex; gap: 8px; margin-top: 6px; }
  .apps select {
    flex: 1; min-width: 0; background: #111214; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 8px; font: inherit;
  }
  .apps select:disabled { opacity: .5; }
</style>
</head>
<body>
  <header>
    <h1>Compartilhar tela</h1>
    <button class="refresh" id="refresh" title="Atualizar a lista">Atualizar</button>
  </header>
  <div class="tabs">
    <button class="tab active" data-type="screen">Telas inteiras</button>
    <button class="tab" data-type="window">Janelas</button>
  </div>
  <main>
    <div class="grid" id="grid"></div>
    <div class="audio-pane" id="audioPane">
      <div class="note">
        No seu Linux (Wayland), <strong>a tela ou a janela você escolhe na próxima janela</strong>, que é
        do próprio sistema. Aqui você escolhe só <strong>o som</strong> que vai junto.
      </div>
      <label class="option selected" data-mode="system">
        <input type="radio" name="audio" value="system" checked>
        <span class="txt"><strong>Som do computador todo</strong><small>tudo que estiver tocando, menos o didiscord (pra ninguém ouvir eco)</small></span>
      </label>
      <label class="option" data-mode="app">
        <input type="radio" name="audio" value="app">
        <span class="txt">
          <strong>Só o som de um app</strong>
          <small id="appsHint">ex: só o jogo ou só o navegador</small>
          <span class="apps">
            <select id="appSelect" disabled></select>
            <button type="button" class="refresh" id="appsRefresh" title="Atualizar a lista">Atualizar</button>
          </span>
        </span>
      </label>
      <label class="option" data-mode="none">
        <input type="radio" name="audio" value="none">
        <span class="txt"><strong>Sem som</strong><small>só a imagem</small></span>
      </label>
    </div>
  </main>
  <footer>
    <button class="btn" id="cancel">Cancelar</button>
    <button class="btn primary" id="share" disabled>Compartilhar</button>
  </footer>

<script>
  let sources = [];
  let activeType = 'screen';
  let selectedId = null;

  const grid = document.getElementById('grid');
  const shareBtn = document.getElementById('share');

  function render() {
    grid.textContent = '';
    const list = sources.filter((s) => s.type === activeType);
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = activeType === 'screen' ? 'Nenhuma tela encontrada.' : 'Nenhuma janela aberta encontrada.';
      grid.appendChild(empty);
      return;
    }
    for (const s of list) {
      const card = document.createElement('div');
      card.className = 'card' + (s.id === selectedId ? ' selected' : '');

      const thumb = document.createElement('img');
      thumb.className = 'thumb';
      thumb.src = s.thumbnail;
      thumb.alt = '';
      card.appendChild(thumb);

      const label = document.createElement('div');
      label.className = 'label';
      if (s.appIcon) {
        const icon = document.createElement('img');
        icon.src = s.appIcon;
        icon.alt = '';
        label.appendChild(icon);
      }
      const name = document.createElement('span');
      name.textContent = s.name;
      name.title = s.name;
      label.appendChild(name);
      card.appendChild(label);

      card.addEventListener('click', () => { selectedId = s.id; shareBtn.disabled = false; render(); });
      card.addEventListener('dblclick', () => window.pickerApi.choose(s.id));
      grid.appendChild(card);
    }
  }

  async function load() {
    sources = await window.pickerApi.getSources();
    if (selectedId && !sources.some((s) => s.id === selectedId)) {
      selectedId = null;
      shareBtn.disabled = true;
    }
    // se não tem nenhuma tela mas tem janelas (ou o contrário), já abre na aba que tem coisa
    if (!sources.some((s) => s.type === activeType) && sources.length) {
      activeType = sources[0].type;
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.type === activeType));
    }
    render();
  }

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      activeType = tab.dataset.type;
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
      render();
    });
  });
  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('cancel').addEventListener('click', () => window.pickerApi.cancel());
  shareBtn.addEventListener('click', () => {
    if (window.pickerApi.mode === 'audio') submitAudio();
    else if (selectedId) window.pickerApi.choose(selectedId);
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.pickerApi.cancel();
    if (e.key === 'Enter' && window.pickerApi.mode === 'audio' && !shareBtn.disabled) submitAudio();
    else if (e.key === 'Enter' && selectedId) window.pickerApi.choose(selectedId);
  });

  // ---------- modo Wayland: só a escolha do som ----------
  const appSelect = document.getElementById('appSelect');
  const appsHint = document.getElementById('appsHint');
  let audioMode = 'system';

  function selectAudioMode(mode) {
    audioMode = mode;
    document.querySelectorAll('.option').forEach((o) => o.classList.toggle('selected', o.dataset.mode === mode));
    document.querySelectorAll('input[name="audio"]').forEach((r) => { r.checked = r.value === mode; });
    appSelect.disabled = mode !== 'app' || !appSelect.options.length;
    shareBtn.disabled = mode === 'app' && !appSelect.value;
  }

  async function loadApps() {
    const keep = appSelect.value;
    const { available, apps } = await window.pickerApi.getAudioApps();
    appSelect.textContent = '';
    for (const a of apps) {
      const opt = document.createElement('option');
      opt.value = a.key;
      opt.textContent = a.name.toLowerCase() === a.key.toLowerCase() ? a.name : `${a.name} (${a.key})`;
      appSelect.appendChild(opt);
    }
    if (keep && apps.some((a) => a.key === keep)) appSelect.value = keep;
    if (!available) {
      appsHint.textContent = 'precisa do PipeWire (pacote pipewire-bin) pra pegar o som — vai sem som';
      document.querySelector('.option[data-mode="system"]').style.display = 'none';
      document.querySelector('.option[data-mode="app"]').style.display = 'none';
      selectAudioMode('none');
      return;
    }
    appsHint.textContent = apps.length
      ? 'apps tocando som agora'
      : 'nenhum app tocando agora — dê play no que quer compartilhar e clique em Atualizar';
    selectAudioMode(audioMode);
  }

  function setupAudioMode() {
    document.body.classList.add('audio-mode');
    document.querySelector('h1').textContent = 'Som do compartilhamento';
    shareBtn.textContent = 'Continuar';
    shareBtn.disabled = false;
    document.querySelectorAll('.option').forEach((o) => o.addEventListener('click', () => selectAudioMode(o.dataset.mode)));
    appSelect.addEventListener('change', () => selectAudioMode('app'));
    document.getElementById('appsRefresh').addEventListener('click', (e) => { e.preventDefault(); loadApps(); });
    loadApps();
  }

  function submitAudio() {
    window.pickerApi.chooseAudio({ mode: audioMode, appKey: audioMode === 'app' ? appSelect.value : null });
  }

  if (window.pickerApi.mode === 'audio') {
    setupAudioMode();
  } else {
    load();
  }
</script>
</body>
</html>
