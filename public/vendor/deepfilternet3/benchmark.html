<!doctype html>
<meta charset="utf-8">
<title>benchmark DeepFilterNet3</title>
<script type="module">
  import { DeepFilterNet3Core } from '/vendor/deepfilternet3/index.esm.js';

  const SR = 48000;
  const SECONDS = 12;
  const N = SR * SECONDS;

  // ruído branco (ventilador/chiado) — e uma "voz" sintética: fundamental 140 Hz + harmônicos,
  // ligando e desligando como sílabas, por cima do mesmo ruído
  function makeInput(withVoice) {
    const buf = new Float32Array(N);
    let seed = 12345;
    const rand = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff) * 2 - 1;
    for (let i = 0; i < N; i++) {
      let v = rand() * 0.08;
      if (withVoice) {
        const t = i / SR;
        const syllable = Math.sin(2 * Math.PI * 3 * t) > -0.2 ? 1 : 0; // ~3 sílabas por segundo
        const f0 = 140 + 20 * Math.sin(2 * Math.PI * 0.5 * t);
        let voice = 0;
        for (let h = 1; h <= 12; h++) voice += Math.sin(2 * Math.PI * f0 * h * t) / h;
        v += syllable * voice * 0.12;
      }
      buf[i] = v;
    }
    return buf;
  }

  const rms = (a, from, to) => { let s = 0; for (let i = from; i < to; i++) s += a[i] * a[i]; return Math.sqrt(s / (to - from)); };
  const db = (x) => (20 * Math.log10(x + 1e-12)).toFixed(1);

  async function run(core, withVoice) {
    const ctx = new OfflineAudioContext(1, N, SR);
    const input = makeInput(withVoice);
    const buffer = ctx.createBuffer(1, N, SR);
    buffer.copyToChannel(input, 0);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const node = await core.createAudioWorkletNode(ctx);
    src.connect(node);
    node.connect(ctx.destination);
    src.start();
    const t0 = performance.now();
    const out = (await ctx.startRendering()).getChannelData(0);
    const ms = performance.now() - t0;
    // ignora os 2 primeiros segundos (modelo aquecendo)
    const from = SR * 2;
    return { ms, inRms: rms(input, from, N), outRms: rms(out, from, N) };
  }

  (async () => {
    const result = {};
    try {
      const t0 = performance.now();
      const core = new DeepFilterNet3Core({ sampleRate: SR, noiseReductionLevel: 100, assetConfig: { cdnUrl: '/vendor/deepfilternet3' } });
      await core.initialize();
      result.loadMs = Math.round(performance.now() - t0);
      const noise = await run(core, false);
      const voice = await run(core, true);
      result.realtimeFactor = +(noise.ms / (SECONDS * 1000)).toFixed(3);
      result.msPer10msFrame = +(noise.ms / (SECONDS * 100)).toFixed(2);
      result.noiseOnly = { inDb: db(noise.inRms), outDb: db(noise.outRms), reductionDb: db(noise.inRms) - db(noise.outRms) };
      result.voicePlusNoise = { inDb: db(voice.inRms), outDb: db(voice.outRms) };
      result.ok = true;
    } catch (err) {
      result.error = String(err && err.stack || err);
    }
    window.__result = result;
    document.body.textContent = JSON.stringify(result, null, 2);
  })();
</script>
