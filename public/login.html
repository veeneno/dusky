<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="/js/compat.js?v=1"></script>
  <script src="/js/themes.js?v=22"></script>
  <script>DuskyTheme.boot();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#16141f">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>entrar — dusky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css?v=20">
  <link rel="stylesheet" href="/css/auth.css?v=21">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card card">
      <div class="auth-mark">
        <img class="auth-logo" src="/img/brand/logo-transparente-256.png" width="96" height="96" alt="dusky">
      </div>

      <h1 class="auth-title display" id="formTitle">bem-vindo de volta</h1>
      <p class="auth-tagline" id="formTagline">entre para continuar</p>

      <!-- aparece quando a pessoa chega por um link de convite -->
      <div class="auth-invite" id="authInvite" hidden>
        <div class="auth-invite-icon" id="authInviteIcon"></div>
        <div class="auth-invite-text">
          <span id="authInviteLead">você foi convidado pra</span>
          <strong id="authInviteName"></strong>
        </div>
      </div>

      <div class="auth-banner error" id="authBanner"></div>

      <form class="auth-form" id="authForm" autocomplete="off">
        <div class="field">
          <label for="username">usuário</label>
          <input type="text" id="username" name="username" placeholder="seu nome de usuário" required minlength="2" maxlength="32" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submitBtn">entrar</button>
      </form>

      <p class="auth-switch">
        <span id="switchText">ainda não tem conta?</span>
        <button type="button" id="switchBtn">criar conta</button>
      </p>
      <p class="auth-switch"><a href="/baixar" style="color: var(--amethyst-hi)">baixar o app pro computador</a></p>
    </div>
  </div>

  <script src="/js/auth.js?v=20"></script>
</body>
</html>
